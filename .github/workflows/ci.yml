name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    services:
      test-db:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: --health-cmd "pg_isready -U test" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ChromaticがGit履歴にアクセスできるようにする

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存関係インストール
        run: npm ci

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json') }}

      - name: Setup test environment
        env:
          AUTH_SECRET: "dummy-secret-for-testing"
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5433/test" > .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "AUTH_SECRET=$AUTH_SECRET" >> .env.test
          echo "NEXTAUTH_URL=http://localhost:3001" >> .env.test
          npm run migrate:test
          npm run seed:test

      - name: Run unit tests
        run: npm run test:vitest

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      # Chromaticテストを追加
      - name: Run Chromatic Tests
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          onlyChanged: true

      - name: Serve Storybook and run tests
        run: |
          npx concurrently -k -s first \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:6006 && npm run test:storybook"

      - name: Run E2E tests
        run: npm run test:e2e
